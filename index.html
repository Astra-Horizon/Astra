<script>

(function(){var s=$('stars');for(var i=0;i<60;i++){var d=document.createElement('i'),z=Math.random()<.2?3:2;

  try{var h=new URL(u).hostname.replace(/^www\./,'');

function applySandbox(f){
  if(fixEnabled)f.setAttribute('sandbox','allow-forms allow-scripts allow-same-origin');
  else f.removeAttribute('sandbox');
}

function addTab(url){
  url=norm(url===undefined?addr.value:url);

renderQuick();renderTabs();
if(START_URL)addTab(START_URL);

</body>
</html>
