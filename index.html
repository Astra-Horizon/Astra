<script>
var $=function(i){return document.getElementById(i)};
var view=$('view'),menu=$('menu'),scrim=$('scrim'),orb=$('orb'),addr=$('addr'),list=$('tablist');
var ALLOW='fullscreen; autoplay; clipboard-write; gamepad; microphone; camera; pointer-lock; keyboard-map';
var COLORS=['#2b2b2b','#3a3a3a','#474747','#555','#333','#444'];
var QUICK=[['Astra AI','astra-ai'],['CloudMoon','https://web.cloudmoonapp.com/']];
var CLOAKS=[['Off','',''],['Google Docs','Untitled document - Google Docs','#4285f4'],['Classroom','Classes','#1e8e3e'],['Google Drive','My Drive - Google Drive','#f9ab00']];
var ACCENTS=[['#e6e6ec','#ffffff'],['#7cc4ff','#cfe9ff'],['#ffd166','#fff0c2'],['#ff7b9c','#ffd0dc'],['#7dffa8','#d3ffe3']];
var tabs=[],active=-1,fixEnabled=false;

/* ---- preferences ---- */
var prefs={cloak:0,accent:0,panic:false,links:[]};
try{Object.assign(prefs,JSON.parse(localStorage.getItem('astra_prefs')||'{}'))}catch(e){}
function savePrefs(){try{localStorage.setItem('astra_prefs',JSON.stringify(prefs))}catch(e){}}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}

/* block text selection / dragging outside inputs */
document.addEventListener('selectstart',function(e){if(!/^(INPUT|TEXTAREA)$/.test(e.target.tagName||''))e.preventDefault()});
document.addEventListener('dragstart',function(e){e.preventDefault()});

(function(){var s=$('stars');for(var i=0;i<60;i++){var d=el('i'),z=Math.random()<.2?3:2;
d.style.cssText='left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;width:'+z+'px;height:'+z+'px;animation-delay:'+(-Math.random()*4)+'s;animation-duration:'+(3+Math.random()*4)+'s';s.appendChild(d)}})();

/* ---- menu ---- */
function setMenu(o){
  menu.classList.toggle('open',o);scrim.style.display=o?'block':'none';orb.classList.toggle('on',o);
  orb.setAttribute('aria-label',o?'Close menu':'Open menu');
  if(o)renderTabs();
}

/* ---- tabs ---- */
function norm(v){v=(v||'').trim();return !v?'':/^https?:\/\//i.test(v)?v:'https://'+v}
function nameOf(u){
  try{var h=new URL(u).hostname.replace(/^www\./,'');return h.indexOf('cloudmoon')>-1?'CloudMoon':h.charAt(0).toUpperCase()+h.slice(1)}
  catch(e){return 'New Tab'}
}
function avatar(name){
  var n=0,a=el('span','av',name.charAt(0).toUpperCase());
  for(var i=0;i<name.length;i++)n+=name.charCodeAt(i);
  a.style.background=COLORS[n%COLORS.length];return a;
}
function applySandbox(f){
  if(fixEnabled)f.setAttribute('sandbox','allow-forms allow-scripts allow-same-origin');
  else f.removeAttribute('sandbox');
}
function addTab(url){
  url=norm(url===undefined?addr.value:url);
  if(!url)return;
  var id='f'+Date.now()+Math.floor(Math.random()*99),f=el('iframe');
  f.id=id;f.setAttribute('allow',ALLOW);
  applySandbox(f);f.src=url;view.appendChild(f);
  tabs.push({id:id,name:nameOf(url)});
  addr.value='';switchTab(tabs.length-1);setMenu(false);
}
function switchTab(i){
  active=i;
  Array.prototype.forEach.call(view.children,function(f){f.classList.toggle('on',!!tabs[i]&&f.id===tabs[i].id)});
  $('welcome').style.display=i<0?'flex':'none';
  renderTabs();
}
function closeTab(e,i){
  e.stopPropagation();
  var f=$(tabs[i].id);if(f)f.remove();
  tabs.splice(i,1);
  if(!tabs.length)switchTab(-1);
  else switchTab(Math.max(0,Math.min(active>=i?active-1:active,tabs.length-1)));
}
function renderTabs(){
  list.innerHTML='';
  if(!tabs.length){list.appendChild(el('div','none','No tabs open.'));return}
  tabs.forEach(function(t,i){
    var r=el('div','trow'+(i===active?' on':'')),x=el('button','x','\u00d7');
    x.setAttribute('aria-label','Close tab');
    x.onclick=function(e){closeTab(e,i)};
    r.onclick=function(){switchTab(i);setMenu(false)};
    r.append(avatar(t.name),el('span','n',t.name),x);list.appendChild(r);
  });
}
function renderQuick(){
  var q=$('quick');q.innerHTML='';
  QUICK.concat(prefs.links).forEach(function(l){
    var b=el('button','t');b.append(avatar(l[0]),l[0]);
    b.onclick=function(){if(l[1]==='astra-ai')openAI();else addTab(l[1])};q.appendChild(b);
  });
}
function toggleFix(){
  fixEnabled=!fixEnabled;
  $('swFix').classList.toggle('on',fixEnabled);
  tabs.forEach(function(t){
    if(t.ai)return;
    var f=$(t.id),src=f.src;applySandbox(f);f.src='about:blank';
    setTimeout(function(){f.src=src},50);
  });
}

/* ---- Astra AI: native chat tab, handled by the Supabase edge function ---- */
var AI_URL='https://nzctnrhudojfsilcorio.supabase.co/functions/v1/astra-ai';
var AI_TOK='astraK7mQ9vXp4N2bT8wZ6R3jL5c';
function openAI(){
  for(var i=0;i<tabs.length;i++)if(tabs[i].ai){switchTab(i);setMenu(false);return}
  var d=el('div','aipanel'),hist=[];
  d.id='ai'+Date.now();
  d.innerHTML='<div class="aihead"><svg viewBox="0 0 32 32"><g transform="rotate(-18 16 16)" fill="none" stroke="#fff"><ellipse cx="16" cy="16" rx="14" ry="3.8" stroke-width="1.7"/><circle cx="16" cy="16" r="6.4" fill="#000" stroke-width="1.1"/><path d="M2 16a14 3.8 0 0 0 28 0" stroke-width="2"/></g></svg><b>Astra AI</b><small>ASTRA</small></div>'
    +'<div class="aichat"><div class="aimsg a">Hey! I\'m Astra AI. Ask me anything - homework, code, ideas, or just chat.</div></div>'
    +'<form class="aiform"><input placeholder="Ask Astra AI anything..." autocomplete="off" maxlength="2000" aria-label="Message"><button type="submit">Send</button></form>';
  view.appendChild(d);
  tabs.push({id:d.id,name:'Astra AI',ai:true});
  switchTab(tabs.length-1);setMenu(false);
  var chat=d.querySelector('.aichat'),form=d.querySelector('.aiform'),inp=d.querySelector('input'),send=d.querySelector('button');
  function add(cls,text){var m=el('div','aimsg '+cls,text);chat.appendChild(m);chat.scrollTop=chat.scrollHeight}
  function typing(on){
    var t=d.querySelector('.aityping');
    if(on&&!t){t=el('div','aityping');t.innerHTML='<i></i><i></i><i></i>';chat.appendChild(t);chat.scrollTop=chat.scrollHeight}
    else if(!on&&t)t.remove();
  }
  form.onsubmit=function(e){
    e.preventDefault();
    var text=inp.value.trim();
    if(!text||send.disabled)return;
    inp.value='';add('m',text);hist.push({role:'user',content:text});
    send.disabled=true;typing(true);
    fetch(AI_URL,{method:'POST',headers:{'Content-Type':'application/json','x-astra-token':AI_TOK},body:JSON.stringify({messages:hist.slice(-16)})})
      .then(function(r){return r.json().catch(function(){return{}}).then(function(j){
        if(!r.ok||j.error)throw new Error(j.error||('Server error '+r.status));
        return j;
      })})
      .then(function(j){
        typing(false);var t=(j.reply||'').trim();
        add('a',t||'...');hist.push({role:'assistant',content:t});
        send.disabled=false;inp.focus();
      })
      .catch(function(err){typing(false);add('a','Hmm, I could not reach the AI: '+err.message);send.disabled=false});
  };
  setTimeout(function(){inp.focus()},60);
}

/* ---- cloak / accent / panic ---- */
var iconEl=document.querySelector('link[rel~=icon]'),origTitle=document.title,origIcon=iconEl.href;
function applyCloak(){
  var c=CLOAKS[prefs.cloak]||CLOAKS[0];
  if(!c[1]){document.title=origTitle;iconEl.href=origIcon;return}
  document.title=c[1];
  iconEl.href='data:image/svg+xml,'+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='"+c[2]+"'/><rect x='9' y='7' width='14' height='18' rx='2' fill='#fff'/></svg>");
}
function applyAccent(){

}
function pick(group,i){Array.prototype.forEach.call(group.children,function(c,j){c.classList.toggle('on',j===i)})}
function switchRow(title,sub,on,cb){
  var r=el('div','row'),d=el('div',null,title),s=el('button','sw'+(on?' on':''));
  d.appendChild(el('small','',sub));s.setAttribute('aria-label',title);

}
function renderPrefs(){
  var box=$('prefs');box.innerHTML='';

  box.appendChild(el('div','h','Tab Cloak'));
  var cw=el('div','chips');
  CLOAKS.forEach(function(c,i){
    var b=el('button','chip'+(i===prefs.cloak?' on':''),c[0]);
    b.onclick=function(){pick(cw,i);prefs.cloak=i;savePrefs();applyCloak()};cw.appendChild(b);
  });
  box.appendChild(cw);

  box.appendChild(el('div','h','Accent Color'));
  var aw=el('div','chips');
  ACCENTS.forEach(function(c,i){
    var b=el('button','swatch'+(i===prefs.accent?' on':''));
    b.style.background=c[0];b.setAttribute('aria-label','Accent '+(i+1));
    b.onclick=function(){pick(aw,i);prefs.accent=i;savePrefs();applyAccent()};aw.appendChild(b);
  });
  box.appendChild(aw);

  box.appendChild(el('div','h','Panic Key'));
  box.appendChild(switchRow('Panic key','Press ` to hide Astra instantly (press again to show)',prefs.panic,function(v){prefs.panic=v;savePrefs()}));

  box.appendChild(el('div','h','Custom Quick Links'));
  var two=el('div','two'),nm=el('input','inp'),ur=el('input','inp'),add=el('button','pill wide','Add Link'),lbox=el('div','sec'),rows=el('div','sec');
  nm.placeholder='Name';nm.maxLength=14;nm.setAttribute('aria-label','Link name');
  ur.placeholder='example.com';ur.setAttribute('aria-label','Link address');
  two.append(nm,ur);lbox.append(two,add,rows);box.appendChild(lbox);
  function drawLinks(){
    rows.innerHTML='';
    prefs.links.forEach(function(l,i){
      var row=el('div','lrow'),x=el('button','x','\u00d7');
      x.setAttribute('aria-label','Remove link');
      x.onclick=function(){prefs.links.splice(i,1);savePrefs();renderQuick();drawLinks()};
      row.append(el('span','',l[0]+'  -  '+l[1]),x);rows.appendChild(row);
    });
  }
  add.onclick=function(){
    var n=nm.value.trim(),u=norm(ur.value);
    if(!n||!u||prefs.links.length>=9)return;
    try{new URL(u)}catch(e){return}
    prefs.links.push([n,u]);savePrefs();renderQuick();nm.value=ur.value='';drawLinks();
  };
  drawLinks();
}

/* ---- events ---- */
orb.onclick=function(){setMenu(!menu.classList.contains('open'))};
scrim.onclick=function(){setMenu(false)};
$('newTab').onclick=function(){addTab()};
$('swFix').onclick=toggleFix;
$('kill').onclick=function(){window.close()};
addr.addEventListener('keydown',function(e){if(e.key==='Enter')addTab()});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')setMenu(false);
  if(prefs.panic&&e.key==='`'){e.preventDefault();$('panic').classList.toggle('on')}
});

renderQuick();renderTabs();renderPrefs();applyCloak();applyAccent();
<\/script>

<script>
var $=function(i){return document.getElementById(i)};

var letters=title.querySelectorAll('.l'),shown=0,root=document.documentElement;
var HOLE={h:300,cy:300},TAU=6.2832;

/* ===== Layout: hole centre sits at 42% height, title is scaled to fit inside the hole ===== */
function layout(){
  var vw=innerWidth,vh=innerHeight,cy=vh*.42;

  root.style.setProperty('--cy',cy+'px');
  root.style.setProperty('--tup',-.08*h+'px');
  root.style.setProperty('--ct',cy+.88*h+14+'px');

}
function placeCaret(){

}
function typeIn(){
  if(shown>=letters.length){
    placeCaret();
    setTimeout(function(){
      caret.classList.add('off');ctl.classList.add('show');launchBtn.focus();
      title.classList.add('live');
      fxPulse(1,true);fxReady=true;nextComet=fxTime+4;
    },850);
    return;
  }
  letters[shown++].classList.add('on');placeCaret();fxPulse(.3,false);
  setTimeout(typeIn,230+Math.random()*120);
}

/* ===== FX state ===== */
var RM=matchMedia('(prefers-reduced-motion: reduce)').matches;

var PX=0,PY=0,starAcc=1,starDirty=true,starSig='';
var GLOW=(function(){var c=document.createElement('canvas');c.width=c.height=64;var g=c.getContext('2d'),r=g.createRadialGradient(32,32,0,32,32,32);
r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.25,'rgba(255,255,255,.35)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,64,64);return c})();

function respawn(p,initial){
  var plunge=Math.random()<.16,sr=Math.random();
  p.plunge=plunge;
  p.r=HH*(initial?.62+Math.random()*1.9:1.9+Math.random()*.55);
  p.th=Math.random()*TAU;
  p.inf=.6+Math.random()*.9;
  p.w=(plunge?.55:1)*(.8+Math.random()*.5);
  p.size=sr<.06?2.4+Math.random()*1.6:sr<.35?1.1+Math.random()*.8:.5+Math.random()*.55;
  p.br=.45+Math.random()*.55;
  p.kick=0;p.life=initial?3:0;
}

/* ===== Black hole renderer (WebGL): lensed streaky disk, photon ring, hot spot ===== */
var GLSL_HASH=[
'float hs(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}',
'float vn(vec2 p){vec2 i=floor(p),f=p-i;vec2 w=f*f*(3.-2.*f);',
' float a=hs(i),b=hs(i+vec2(1.,0.)),c=hs(i+vec2(0.,1.)),d=hs(i+vec2(1.,1.));',
' return mix(mix(a,b,w.x),mix(c,d,w.x),w.y);}'].join('\n');
var GLSL_HEAD='#ifdef GL_FRAGMENT_PRECISION_HIGH\nprecision highp float;\n#else\nprecision mediump float;\n#endif\n';

/* Bake: streak noise computed once into a texture so the main shader needs a single texture read per pixel */
var BH_BAKE=GLSL_HEAD+'uniform vec2 uSz;\n'+GLSL_HASH+'\n'+[
'void main(){',
' float a=gl_FragCoord.x/uSz.x*6.2831853;',
' float r=1.+gl_FragCoord.y/uSz.y*4.2;',
' float ca=cos(a),sa=sin(a);',
' float n1=.5*(vn(vec2(r*46.,ca*3.2))+vn(vec2(r*49.22+13.1,sa*3.2)));',
' float n2=.5*(vn(vec2(r*130.+5.,ca*5.))+vn(vec2(r*130.+31.,sa*5.)));',
' float n3=.5*(vn(vec2(r*9.+2.,ca*1.6))+vn(vec2(r*9.+7.,sa*1.6)));',
' float t=clamp(.55+.9*(n1-.5)+.45*(n2-.5)+.8*(n3-.5),.02,2.);',
' gl_FragColor=vec4(t*.5,0.,0.,1.);}'].join('\n');

var BH_FS=GLSL_HEAD+'uniform vec2 uC,uRot;uniform float uR,uT,uI,uSQ;uniform sampler2D uTex;\n'+GLSL_HASH+'\n'+[
'float ss(float a,float b,float x){float t=clamp((x-a)/(b-a),0.,1.);return t*t*(3.-2.*t);}',
'float streak(float r,float th,float t){',
' float om=.42*pow(max(r,.5),-1.5);',
' float u=fract((th+t*om)*.15915494);',
' return texture2D(uTex,vec2(u,(r-1.)*.23809524)).r*2.;}',
'const float RIN=1.18;const float ROUT=5.2;',
'float emis(float r,float th,float t){',
' float e=pow(1.25/max(r,.1),2.);',
' e*=ss(RIN-.03,RIN+.14,r)*(1.-ss(3.,ROUT,r));',
' if(e<.003)return 0.;',
' return e*exp(-.9*cos(th-.45))*streak(r,th,t);}',
'void main(){',
' vec2 p=(gl_FragCoord.xy-uC)/uR;',
' float rho=length(p);',
' float sh=1.-ss(.985,1.,rho);',
' float u=p.x*uRot.x+p.y*uRot.y;float v=-p.x*uRot.y+p.y*uRot.x;',
' float phi=atan(v,u);',
' float I=0.;',
' float vc=v/uSQ;',
' float wp=max(ss(.98,1.12,rho),ss(0.,-.12,v)*.6);',
' if(wp>.003)I+=emis(sqrt(u*u+vc*vc),atan(vc,u),uT)*wp;',
' if(rho>.985){',
'  float p0=-2.00713;',
'  float d=atan(sin(phi-p0),cos(phi-p0));',
'  float B=.55+1.1*exp(-(d/.75)*(d/.75))+.25*cos(phi-.4);',
'  float e1=(rho-1.022)/.014;float e2=(rho-1.045)/.05;',
'  I+=exp(-e1*e1)*B*2.4+exp(-e2*e2)*B*.55;',
'  I+=exp(-(rho-1.)*7.)*(.18+.55*exp(-(d/.9)*(d/.9)));',
'  float gx=(u-1.12*cos(p0))/.55;float gy=(v-1.12*sin(p0))/.30;',
'  I+=exp(-(gx*gx+gy*gy))*.9;}',
' I=1.-exp(-I*1.45);',
' I*=uI;',
' I=clamp(I+(hs(gl_FragCoord.xy)-.5)/255.,0.,1.);',
' gl_FragColor=vec4(vec3(I),max(I,sh));}'].join('\n');

var bhgl=$('bhgl'),gl=null,GU={},glOK=null,bhT=0;
function initGL(){
  try{
    gl=bhgl.getContext('webgl',{alpha:true,premultipliedAlpha:true,antialias:false,depth:false,stencil:false,preserveDrawingBuffer:true});
    if(!gl)return false;
    var VS='attribute vec2 aP;void main(){gl_Position=vec4(aP,0.,1.);}';
    var mk=function(ty,src){var s=gl.createShader(ty);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s};

      gl.attachShader(p,mk(gl.VERTEX_SHADER,VS));gl.attachShader(p,mk(gl.FRAGMENT_SHADER,fs));
      gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error('link failed');

    };

    gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

    var TW=1024,TH=2048,bk=prog(BH_BAKE),tx=gl.createTexture(),fb=gl.createFramebuffer();
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tx);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,TW,TH,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.bindFramebuffer(gl.FRAMEBUFFER,fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tx,0);
    if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE)throw new Error('fbo');
    gl.useProgram(bk);gl.uniform2f(gl.getUniformLocation(bk,'uSz'),TW,TH);
    gl.viewport(0,0,TW,TH);gl.drawArrays(gl.TRIANGLES,0,3);
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);

    var pr=prog(BH_FS);gl.useProgram(pr);
    ['uC','uR','uT','uI','uRot','uSQ','uTex'].forEach(function(n){GU[n]=gl.getUniformLocation(pr,n)});
    gl.uniform1i(GU.uTex,0);gl.clearColor(0,0,0,0);

  }catch(e){return false}
}
function drawGL(intro){
  var sc=bhgl.width/VW;
  gl.viewport(0,0,bhgl.width,bhgl.height);gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform2f(GU.uC,CX*sc,(VH-CY)*sc);
  gl.uniform1f(GU.uR,HH*.5*sc);

  gl.uniform2f(GU.uRot,Math.cos(-ROT),Math.sin(-ROT));
  gl.uniform1f(GU.uSQ,SQ);
  gl.drawArrays(gl.TRIANGLES,0,3);
}

/* The disk moves slowly, so it redraws at ~30fps (dropping to ~22fps if frames run slow) while particles run at full speed. */
var glInt=1/32,glAcc=1,glDirty=true,perfAcc=0,perfN=0,perfBad=0;
function perfTick(dt){
  if(fxTime<3||dt>.5||glInt>.045)return;
  perfAcc+=dt;perfN++;
  if(perfAcc>=1.5){
    if(perfAcc/perfN>.026){if(++perfBad>=2){perfBad=0;glInt=1/22}}else perfBad=0;
    perfAcc=perfN=0;
  }
}

/* Batched line segments: bucketed by alpha and width so each bucket is one stroke() call */
var BA=12,BW=[.45,.6,.8,1.05,1.4,1.9,2.6,3.6],BCAP=1500,BUF=[],BN=[];
for(var bi=0;bi<BA*8;bi++){BUF.push(new Float32Array(BCAP*4));BN.push(0)}
function wIdx(w){return w<.52?0:w<.7?1:w<.92?2:w<1.22?3:w<1.65?4:w<2.25?5:w<3.1?6:7}
function seg(x1,y1,x2,y2,al,w){
  var ai=Math.min(BA-1,(al*BA)|0),k=ai*8+wIdx(w),n=BN[k];
  if(n>=BCAP)return;
  var b=BUF[k],o=n*4;b[o]=x1;b[o+1]=y1;b[o+2]=x2;b[o+3]=y2;BN[k]=n+1;
}
function flushSegs(c){
  for(var k=0;k<BUF.length;k++){
    var n=BN[k];if(!n)continue;
    c.globalAlpha=((k>>3)+.5)/BA;c.lineWidth=BW[k&7];c.beginPath();
    var b=BUF[k];
    for(var j=0;j<n;j++){var o=j*4;c.moveTo(b[o],b[o+1]);c.lineTo(b[o+2],b[o+3])}
    c.stroke();BN[k]=0;
  }
}

function fxResize(){
  VW=innerWidth;VH=innerHeight;
  var rdpr=devicePixelRatio||1,dpr=Math.min(rdpr,1.25);
  cb.width=cf.width=Math.round(VW*dpr);cb.height=cf.height=Math.round(VH*dpr);
  bhgl.width=Math.max(2,Math.round(VW*dpr));bhgl.height=Math.max(2,Math.round(VH*dpr));
  glDirty=starDirty=true;
  if(glOK===null){glOK=initGL();if(!glOK)hero.classList.add('nogl')}
  xb.setTransform(dpr,0,0,dpr,0,0);xf.setTransform(dpr,0,0,dpr,0,0);
  if(HH&&P.length){var k=HOLE.h/HH;P.forEach(function(p){p.r*=k})}
  HH=HOLE.h;
  var want=Math.max(180,Math.min(680,Math.round(VW*VH/1900)));
  while(P.length<want){var p={};respawn(p,true);P.push(p)}
  P.length=Math.min(P.length,want);
  var ns=Math.max(90,Math.min(300,Math.round(VW*VH/4200)));
  while(ST.length<ns){var rs=Math.random();ST.push({u:Math.random(),v:Math.random(),s:rs<.06?2.2:rs<.25?1.6:1,f:.8+Math.random()*2.2,p:Math.random()*6.28,b:.25+Math.random()*.75})}
  ST.length=Math.min(ST.length,ns);
}
/* disk polar -> screen (flat tilted ellipse); returns nothing, writes PX/PY */
function pj(r,th){
  var x=r*Math.cos(th),y=r*Math.sin(th)*SQ;
  PX=CX+x*CR-y*SR;PY=CY+x*SR+y*CR;
}
function addRing(r0,sp,max,a){RG.push({r:r0,sp:sp,max:max,a:a})}
function fxPulse(n,ring){flash=Math.min(1.6,flash+n);if(ring&&HH&&!RM)addRing(HH*.5,HH*1.3,HH*3.4,.8)}

/* gravitational lensing of a point around the hole: returns bent position in LX/LY */
var LX=0,LY=0;
function lens(x,y,thE){
  var dx=x-CX,dy=y-CY,b=Math.sqrt(dx*dx+dy*dy)+.001,rt=Math.sqrt(b*b+4*thE*thE);
  var k=1+((.5*(b+rt))/b-1)*Math.exp(-Math.pow(b/(3.4*thE),2));
  LX=CX+dx*k;LY=CY+dy*k;return b;
}

function frame(t){
  requestAnimationFrame(frame);
  var dt=(t-fxPrev)/1000;fxPrev=t;
  if(!(dt>0)||!HH)return;
  perfTick(dt);
  if(dt>.05)dt=.05;
  fxTime+=dt;
  var spd=RM?.25:1,i,k,p,g;
  var intro=Math.min(1,fxTime/2.6);intro=intro*intro*(3-2*intro);
  CX=VW/2;CY=HOLE.cy;
  bhT+=dt*spd;

  if(glOK){glAcc+=dt;if(glDirty||glAcc>=glInt-.002){glAcc=0;glDirty=false;drawGL(intro)}}

  starAcc+=dt;
  var drawStars=starDirty||starAcc>=1/32-.002;
  if(drawStars){starAcc=0;starDirty=false;xb.clearRect(0,0,VW,VH);xb.globalCompositeOperation='lighter';xb.fillStyle='#fff'}
  xf.clearRect(0,0,VW,VH);xf.globalCompositeOperation='lighter';
  xf.lineCap='round';xf.strokeStyle='#fff';xf.fillStyle='#fff';

  /* shock rings */
  for(i=RG.length-1;i>=0;i--){
    g=RG[i];g.r+=g.sp*dt;var q=g.r/g.max;
    if(q>=1){RG.splice(i,1);continue}
    xf.globalAlpha=g.a*(1-q)*(1-q)*intro;xf.lineWidth=2.2;xf.beginPath();
    xf.ellipse(CX,CY,g.r,Math.max(.6,g.r*SQ),ROT,0,TAU);xf.stroke();
  }

  /* starfield on the back canvas, bent around the hole (primary + faint secondary image); positions cached, only twinkle changes */
  var thE=HH*.72;
  if(drawStars){
    var sg=VW+'|'+VH+'|'+CX+'|'+CY+'|'+HH;
    if(sg!==starSig){
      starSig=sg;
      ST.forEach(function(st){
        var dx=st.u*VW-CX,dy=st.v*VH-CY,be=Math.sqrt(dx*dx+dy*dy)+.001;
        var rt=Math.sqrt(be*be+4*thE*thE),wl=Math.exp(-Math.pow(be/(3.4*thE),2));
        var kk=1+((.5*(be+rt))/be-1)*wl;
        st.x1=CX+dx*kk-st.s/2;st.y1=CY+dy*kk-st.s/2;
        st.a0=st.b*(1+1.2*Math.max(0,1-be/(2.2*thE)));
        st.h2=be<thE*3;
        if(st.h2){var k2=(.5*(be-rt))/be*wl;st.x2=CX+dx*k2-st.s/2;st.y2=CY+dy*k2-st.s/2}
      });
    }
    ST.forEach(function(st){
      var al=Math.min(1,st.a0*(.55+.45*Math.sin(fxTime*st.f+st.p))*intro);
      xb.globalAlpha=al;xb.fillRect(st.x1,st.y1,st.s,st.s);
      if(st.h2){xb.globalAlpha=al*.35;xb.fillRect(st.x2,st.y2,st.s,st.s)}
    });
  }

  /* orbiting debris */
  var kd=Math.exp(-2.2*dt);
  for(i=0;i<P.length;i++){
    p=P[i];
    var rr=p.r/HH,m=Math.max(.3,rr);
    var om=.55*Math.pow(1/m,1.5)*p.w*spd;
    var inf=.075*HH*p.inf/(m*m)*(rr<1?1.8:1)*(p.plunge?2.2:1)*spd;
    p.th+=om*dt;p.r+=(p.kick-inf)*dt;p.kick*=kd;p.life+=dt;
    var lo=p.plunge?.05:.6;
    if(p.r<lo*HH){respawn(p,false);continue}
    for(k=0;k<RG.length;k++){g=RG[k];if(Math.abs(p.r-g.r)<HH*.12&&p.kick<HH*.5)p.kick=HH*.5*(1-g.r/g.max)}
    pj(p.r,p.th);var X=PX,Y=PY;
    var tl=p.size>1.1?3:1,t1=tl>1?.07:.11,X1,Y1,X2,Y2,X3,Y3;
    pj(p.r+inf*t1,p.th-om*t1);X1=PX;Y1=PY;
    if(tl>1){pj(p.r+inf*.17,p.th-om*.17);X2=PX;Y2=PY;pj(p.r+inf*.32,p.th-om*.32);X3=PX;Y3=PY}
    if(X<-40||X>VW+40||Y<-40||Y>VH+40)continue;
    var a=intro*p.br*(.5+.5*(rr>1?1/rr:1)),fi=p.life/1.5;
    a*=fi>1?1:fi;
    var fo=(rr-lo)/(p.plunge?.15:.22);a*=fo>1?1:fo<0?0:fo;
    if(a<.01)continue;
    a=Math.min(1,a*(.65+.7*(.5+.5*Math.cos(p.th))));
    seg(X1,Y1,X,Y,a,p.size);
    if(tl>1){
      seg(X2,Y2,X1,Y1,a*.5,p.size*.8);
      seg(X3,Y3,X2,Y2,a*.22,p.size*.6);
      if(p.size>1.8||(rr<.9&&a>.5)){var gs=p.size*7;xf.globalAlpha=a*.5;xf.drawImage(GLOW,X-gs/2,Y-gs/2,gs,gs)}
    }
  }
  flushSegs(xf);

  /* comets that fall into the hole */
  if(fxReady&&!RM&&fxTime>nextComet){
    var R0=Math.hypot(VW,VH)*.58;
    CM.push({r:R0,R0:R0,th:Math.random()*TAU,tr:[]});
    nextComet=fxTime+6+Math.random()*6;
  }
  for(i=CM.length-1;i>=0;i--){
    var c=CM[i],qq=1-c.r/c.R0;
    c.r-=(220+1500*qq*qq)*dt;c.th+=(120/Math.max(c.r,60))*dt*(1+qq*2);
    var hx=CX+c.r*Math.cos(c.th),hy=CY+c.r*Math.sin(c.th);
    c.tr.push(hx,hy);if(c.tr.length>56)c.tr.splice(0,2);
    if(c.r<HH*.55){CM.splice(i,1);flash=Math.min(1.6,flash+1);addRing(HH*.5,HH*1.6,HH*3.2,.9);continue}
    var n=c.tr.length/2;
    for(k=1;k<n;k++){
      var u=k/n;xf.globalAlpha=u*u*.85*intro;xf.lineWidth=.5+2.2*u;
      xf.beginPath();xf.moveTo(c.tr[(k-1)*2],c.tr[(k-1)*2+1]);xf.lineTo(c.tr[k*2],c.tr[k*2+1]);xf.stroke();
    }
    var gr=xf.createRadialGradient(hx,hy,0,hx,hy,14);
    gr.addColorStop(0,'rgba(255,255,255,.9)');gr.addColorStop(1,'rgba(255,255,255,0)');
    xf.globalAlpha=intro;xf.fillStyle=gr;xf.beginPath();xf.arc(hx,hy,14,0,TAU);xf.fill();xf.fillStyle='#fff';
  }

  /* shooting stars: random arrivals, straight fast paths, bent by the hole's lens */
  if(!RM&&fxTime>2.6&&SS.length<3&&Math.random()<1-Math.exp(-.28*dt)){
    var sa=(12+Math.random()*40)*Math.PI/180,sdir=Math.random()<.5?1:-1,sv=700+Math.random()*700,sx,sy;
    if(Math.random()<.5){sx=Math.random()*VW;sy=-30}else{sx=sdir>0?-30:VW+30;sy=Math.random()*VH*.45}
    SS.push({x:sx,y:sy,vx:sdir*Math.cos(sa)*sv,vy:Math.sin(sa)*sv,d:0,L:500+Math.random()*1100,w:1+Math.random()*1.4,br:.6+Math.random()*.4,age:0,tr:[]});
  }
  for(i=SS.length-1;i>=0;i--){
    var sh=SS[i];sh.age+=dt;
    var mx=sh.vx*dt,my=sh.vy*dt;sh.x+=mx;sh.y+=my;sh.d+=Math.sqrt(mx*mx+my*my);
    sh.vx*=Math.exp(-.25*dt);sh.vy*=Math.exp(-.25*dt);
    sh.tr.push(sh.x,sh.y);if(sh.tr.length>32)sh.tr.splice(0,2);
    if(sh.d>sh.L||sh.age>6||sh.x<-250||sh.x>VW+250||sh.y>VH+250){SS.splice(i,1);continue}
    var hd=Math.hypot(sh.x-CX,sh.y-CY),near=Math.max(0,Math.min(1,(hd-thE*.9)/(thE*.6)));
    var env=Math.min(1,sh.age/.12)*Math.min(1,(sh.L-sh.d)/(sh.L*.3))*sh.br*intro*near,n2=sh.tr.length/2;
    var px=0,py=0,pb=0;
    for(k=0;k<n2;k++){
      var lb=lens(sh.tr[k*2],sh.tr[k*2+1],thE);
      if(k>0&&lb>thE*.95&&pb>thE*.95&&Math.hypot(LX-px,LY-py)<Math.hypot(sh.tr[k*2]-sh.tr[k*2-2],sh.tr[k*2+1]-sh.tr[k*2-1])*2.5+30){
        var u2=k/n2;xf.globalAlpha=env*u2*u2;xf.lineWidth=sh.w*(.3+.9*u2);
        xf.beginPath();xf.moveTo(px,py);xf.lineTo(LX,LY);xf.stroke();
      }
      px=LX;py=LY;pb=lb;
    }
    var gz=18*sh.w;xf.globalAlpha=env*.8;xf.drawImage(GLOW,px-gz/2,py-gz/2,gz,gz);
  }

  /* flash when something hits the hole */
  if(flash>.01){
    var fr=HH*1.6,fg=xf.createRadialGradient(CX,CY,0,CX,CY,fr);
    fg.addColorStop(0,'rgba(255,255,255,0)');fg.addColorStop(.27,'rgba(255,255,255,0)');
    fg.addColorStop(.36,'rgba(255,255,255,'+(.3*flash).toFixed(3)+')');fg.addColorStop(1,'rgba(255,255,255,0)');
    xf.globalAlpha=1;xf.fillStyle=fg;xf.beginPath();xf.arc(CX,CY,fr,0,TAU);xf.fill();xf.fillStyle='#fff';
    flash*=Math.exp(-2.6*dt);
  }

  /* keep the front canvas out of the black hole itself */
  xf.globalCompositeOperation='destination-out';xf.globalAlpha=1;xf.fillStyle='#000';
  xf.save();xf.translate(CX,CY);xf.rotate(ROT);xf.beginPath();xf.rect(-HH,-HH,2*HH,HH);xf.clip();
  xf.beginPath();xf.arc(0,0,HH/2+.5,0,TAU);xf.fill();xf.restore();
  xf.globalCompositeOperation='lighter';xf.fillStyle='#fff';
  xb.globalAlpha=1;
}

/* ===== boot ===== */
requestAnimationFrame(function(t){fxPrev=t;requestAnimationFrame(frame)});
layout();
addEventListener('resize',layout);
Promise.race([document.fonts.ready,new Promise(function(r){setTimeout(r,1500)})]).then(function(){
  layout();
  /* let stars, disk and particles load first, then start typing the title */
  caret.classList.add('wait');
  var t0=Date.now();
  (function waitScene(){
    if(fxTime>=2.6||Date.now()-t0>7000){caret.classList.remove('wait');setTimeout(typeIn,300)}
    else setTimeout(waitScene,100);
  })();
});

  var popup=window.open('about:blank','AstraSession','width=1280,height=720');
  if(!popup){note.textContent='Pop-up blocked. Allow pop-ups for this page, then try again.';return}

    .split('<\\/script>').join('<'+'/script>')

};
</script>
