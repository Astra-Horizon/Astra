  <p>Your window is ready. Pick a destination below, or open the menu with the black hole in the top corner to enter any site.</p>
  <div class="tiles" id="wtiles"></div>
</div>

<div id="scrim"></div>
<button id="orb" aria-label="Open menu" title="Menu"><span class="ob"><span class="bh"><span class="dk b"></span><span class="ln"></span><span class="ar u"></span><span class="ar l"></span><span class="hl"></span><span class="dk f"></span></span></span></button>

<div id="menu" role="dialog" aria-label="Astra menu">
  <div class="mh"><div class="mark" aria-hidden="true"><div class="bh"><div class="dk b"></div><div class="ln"></div><div class="ar u"></div><div class="ar l"></div><div class="hl"></div><div class="dk f"></div></div></div>Astra</div>
  <div class="field">
    <input id="addr" type="text" placeholder="Search or enter a site" spellcheck="false" autocomplete="off" aria-label="Address">
    <button class="pill" id="go">Go</button>
    <button class="pill alt" id="nt" title="New tab" aria-label="New tab">+</button>
  </div>
  <div class="acts">
    <button class="act" id="home">Home</button>
    <button class="act" id="rl">Reload</button>
    <button class="act" id="fs">Fullscreen</button>
  </div>
  <div class="h">Open tabs</div>
  <div id="tablist"></div>
  <div class="h">Jump to</div>
  <div class="qgrid" id="quick"></div>
  <div class="h">Options</div>
  <div class="row"><div>CloudMoon Fix<small>Turn this on after signing up</small></div><button class="sw" id="swFix" aria-label="CloudMoon Fix"></button></div>
</div>

<script>
var tabs=[],active=-1,fix=false;
var ALLOW='fullscreen; autoplay; clipboard-write; gamepad; microphone; camera; pointer-lock; keyboard-map';
var COLORS=['#2b2b2b','#3a3a3a','#474747','#555','#333','#444'];
var QUICK=[['CloudMoon','https://web.cloudmoonapp.com/'],['Google','https://www.google.com/'],['DuckDuckGo','https://duckduckgo.com/'],['YouTube','https://www.youtube.com/'],['Reddit','https://www.reddit.com/'],['Twitch','https://www.twitch.tv/']];
var $=function(i){return document.getElementById(i)};
var view=$('view'),menu=$('menu'),scrim=$('scrim'),orb=$('orb'),addr=$('addr'),list=$('tablist');
document.addEventListener('selectstart',function(e){var t=e.target;if(!t||!/^(INPUT|TEXTAREA)$/.test(t.tagName||''))e.preventDefault()});document.addEventListener('dragstart',function(e){e.preventDefault()});
function mkStars(n){var s=document.getElementById('stars');for(var i=0;i<n;i++){var d=document.createElement('i'),z=Math.random()<.2?3:2;
d.style.left=Math.random()*100+'%';d.style.top=Math.random()*100+'%';d.style.width=d.style.height=z+'px';
d.style.animationDelay=(-Math.random()*4)+'s';d.style.animationDuration=(3+Math.random()*4)+'s';s.appendChild(d);}}
function warp(ms,instant){
var c=document.createElement('canvas');c.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;z-index:999;pointer-events:none;background:#000;opacity:'+(instant?1:0)+';transition:opacity .25s';
document.body.appendChild(c);var w=c.width=window.innerWidth||1280,h=c.height=window.innerHeight||720,x=c.getContext('2d'),cx=w/2,cy=h/2,max=Math.hypot(cx,cy);
var S=[];for(var i=0;i<260;i++)S.push({a:Math.random()*6.283,r:Math.random()*max*.15,v:.6+Math.random()*1.4,h:Math.random()});
requestAnimationFrame(function(){c.style.opacity=1});
var t0=performance.now();
(function f(t){var p=Math.min(1,(t-t0)/ms);x.fillStyle='rgba(0,0,0,.35)';x.fillRect(0,0,w,h);var k=1+p*p*28;
for(var i=0;i<S.length;i++){var s=S[i],r0=s.r;s.r+=s.v*k*(.6+s.r/max*3);
var x0=cx+Math.cos(s.a)*r0,y0=cy+Math.sin(s.a)*r0,x1=cx+Math.cos(s.a)*s.r,y1=cy+Math.sin(s.a)*s.r;
x.strokeStyle='hsla(0,0%,'+(75+s.h*25)+'%,'+(.3+p*.7)+')';x.lineWidth=1+s.v*(1+p);
x.beginPath();x.moveTo(x0,y0);x.lineTo(x1,y1);x.stroke();
if(s.r>max){s.r=Math.random()*max*.1;s.a=Math.random()*6.283}}
if(p<1)requestAnimationFrame(f);else{c.style.transition='opacity .5s';c.style.opacity=0;setTimeout(function(){c.remove()},550)}})(t0);
}
mkStars(60);
warp(1000,true);

function setMenu(o){
  menu.classList.toggle('open',o); scrim.style.display=o?'block':'none'; orb.classList.toggle('on',o);
  orb.setAttribute('aria-label',o?'Close menu':'Open menu');
  if(o) renderTabs();
}
function norm(v){
  v=v.trim(); if(!v) return '';
  if(/^https?:\/\//i.test(v)) return v;
  if(/^[^\s]+\.[^\s]{2,}$/.test(v)) return 'https://'+v;
  return 'https://duckduckgo.com/?q='+encodeURIComponent(v);
}
function nameOf(u){
  try{var h=new URL(u).hostname.replace(/^www\./,'');
    if(h.indexOf('cloudmoon')>-1) return 'CloudMoon';
    return h.charAt(0).toUpperCase()+h.slice(1);
  }catch(e){return 'New tab';}
}
function colorOf(s){var n=0;for(var i=0;i<s.length;i++)n+=s.charCodeAt(i);return COLORS[n%COLORS.length]}
function avatar(name){var a=document.createElement('span');a.className='av';a.style.background=colorOf(name);a.textContent=name.charAt(0).toUpperCase();return a}
function sandbox(f){
  if(fix) f.setAttribute('sandbox','allow-forms allow-scripts allow-same-origin allow-popups');
  else f.removeAttribute('sandbox');
}
function addTab(u){
  u=norm(u); if(!u) return;
  var f=document.createElement('iframe'),id='f'+Date.now()+Math.floor(Math.random()*99);
  f.id=id; f.setAttribute('allow',ALLOW);
  sandbox(f); f.src=u; view.appendChild(f);
  tabs.push({id:id,url:u,name:nameOf(u),ntp:false});
  switchTab(tabs.length-1); setMenu(false);
}
function switchTab(i){
  active=i;
  var fs=view.children;
  for(var k=0;k<fs.length;k++) fs[k].classList.toggle('on',!!tabs[i]&&fs[k].id===tabs[i].id);
  $('welcome').style.display=i<0?'flex':'none';
  addr.value=tabs[i]?tabs[i].url:'';
  renderTabs();
}
function closeTab(e,i){
  e.stopPropagation();
  var el=$(tabs[i].id); if(el) el.remove();
  tabs.splice(i,1);
  if(!tabs.length) switchTab(-1);
  else switchTab(Math.max(0,Math.min(active>=i?active-1:active,tabs.length-1)));
}
function renderTabs(){
  list.innerHTML='';
  if(!tabs.length){var n=document.createElement('div');n.className='none';n.textContent='No tabs yet. Jump to a site or enter one above.';list.appendChild(n);return;}
  tabs.forEach(function(t,i){
    var r=document.createElement('div');r.className='trow'+(i===active?' on':'');
    var s=document.createElement('span');s.textContent=t.name;
    var x=document.createElement('button');x.className='x';x.textContent='\u00d7';x.setAttribute('aria-label','Close tab');
    x.onclick=function(e){closeTab(e,i)};
    r.onclick=function(){switchTab(i);setMenu(false)};
    r.appendChild(avatar(t.name));r.appendChild(s);r.appendChild(x);list.appendChild(r);
  });
}
function reload(){
  if(active<0||tabs[active].ntp) return;
  var f=$(tabs[active].id),s=f.src; f.src='about:blank'; setTimeout(function(){f.src=s},60); setMenu(false);
}
function idxOf(id){for(var i=0;i<tabs.length;i++)if(tabs[i].id===id)return i;return -1}
function navTab(i,u){
  u=norm(u); if(!u||!tabs[i]) return;
  var t=tabs[i],el=$(t.id);
  if(t.ntp){
    var f=document.createElement('iframe');f.id=t.id;
    f.setAttribute('allow',ALLOW);sandbox(f);f.src=u;
    view.replaceChild(f,el);t.ntp=false;
  } else el.src=u;
  t.url=u;t.name=nameOf(u);
  switchTab(i);setMenu(false);
}
function buildNTP(id){
  var d=document.createElement('div');d.className='ntp';d.id=id;
  d.innerHTML='<div class="mini" aria-hidden="true"><div class="bh"><div class="halo"></div><div class="dk b"></div><div class="ln"></div><div class="ar u"></div><div class="ar l"></div><div class="hl"></div><div class="dk f"></div></div></div><h1>Astra</h1><div class="nfield"><input class="nin" type="text" placeholder="Search or enter a site" spellcheck="false" autocomplete="off" aria-label="Address"><button class="pill nbtn">Go</button></div><div class="tiles"></div>';
  var inp=d.querySelector('.nin'),btn=d.querySelector('.nbtn'),tl=d.querySelector('.tiles');
  function sub(){if(!inp.value.trim()){inp.focus();return;}navTab(idxOf(id),inp.value)}
  btn.onclick=sub;
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')sub()});
  QUICK.forEach(function(q){
    var b=document.createElement('button');b.className='t';
    b.appendChild(avatar(q[0]));b.appendChild(document.createTextNode(q[0]));
    b.onclick=function(){navTab(idxOf(id),q[1])};tl.appendChild(b);
  });
  return d;
}
function addNTP(){
  var id='f'+Date.now()+Math.floor(Math.random()*99);
  var d=buildNTP(id);view.appendChild(d);
  tabs.push({id:id,url:'',name:'New tab',ntp:true});
  switchTab(tabs.length-1);setMenu(false);
  setTimeout(function(){d.querySelector('.nin').focus()},60);
}
function go(){
  var u=norm(addr.value); if(!u){addr.focus();return;}
  if(active>=0) navTab(active,u); else addTab(u);
}
function tile(q,parent){
  var b=document.createElement('button');b.className='t';
  b.appendChild(avatar(q[0]));b.appendChild(document.createTextNode(q[0]));
  b.onclick=function(){addTab(q[1])};parent.appendChild(b);
}
QUICK.forEach(function(q){tile(q,$('wtiles'));tile(q,$('quick'))});

orb.onclick=function(){setMenu(!menu.classList.contains('open'))};
scrim.onclick=function(){setMenu(false)};
$('go').onclick=function(){go()};
$('nt').onclick=addNTP;
addr.addEventListener('keydown',function(e){if(e.key==='Enter')go()});
$('home').onclick=function(){switchTab(-1);setMenu(false)};
$('rl').onclick=reload;
$('fs').onclick=function(){
  var d=document,el=d.documentElement;
  if(d.fullscreenElement) d.exitFullscreen(); else if(el.requestFullscreen) el.requestFullscreen();
  setMenu(false);
};
$('swFix').onclick=function(){
  fix=!fix; this.classList.toggle('on',fix);
  var fs=view.querySelectorAll('iframe');
  for(var k=0;k<fs.length;k++){(function(f){var s=f.src;sandbox(f);f.src='about:blank';setTimeout(function(){f.src=s},60)})(fs[k]);}
};
document.addEventListener('keydown',function(e){
  if(e.key==='Escape') setMenu(false);
});
<\/script>
</body>
</html>
</script>
