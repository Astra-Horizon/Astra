<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astra</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000'/%3E%3Cg transform='rotate(-18 16 16)' fill='none' stroke='%23fff'%3E%3Cellipse cx='16' cy='16' rx='14' ry='3.8' stroke-width='1.7'/%3E%3Ccircle cx='16' cy='16' r='6.4' fill='%23000' stroke-width='1.1'/%3E%3Cpath d='M2 16a14 3.8 0 0 0 28 0' stroke-width='2'/%3E%3C/g%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&amp;family=Manrope:wght@400;600;800&amp;display=swap" rel="stylesheet">
<style>
:root{--head:'Unbounded','Manrope',system-ui,sans-serif;--body:'Manrope',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000;color:#fff;font-family:var(--body)}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
main[hidden]{display:none}
.face{font-size:clamp(5rem,22vmin,10rem);line-height:1;animation:shake .5s ease-in-out infinite alternate}
@keyframes shake{from{transform:rotate(-6deg) scale(1)}to{transform:rotate(6deg) scale(1.06)}}
h1{margin:0;font-family:var(--head);font-weight:800;letter-spacing:-.02em;font-size:clamp(1.8rem,7vw,4rem);line-height:1.05;background:linear-gradient(180deg,#fff 5%,#ff9bb0 95%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
p{margin:0;max-width:460px;color:#9b9ba5;line-height:1.55}
ol{margin:0;padding:0;list-style:none;max-width:460px;color:#d6d6dc;line-height:1.6;font-size:.95rem}
ol li{margin:4px 0}
button{border:0;border-radius:999px;padding:1rem 2.6rem;font:inherit;font-size:1.02rem;font-weight:800;color:#000;cursor:pointer;background:linear-gradient(120deg,#fff,#d6d6dc);box-shadow:0 10px 40px rgba(255,255,255,.3);transition:transform .2s,box-shadow .2s;margin-top:6px}
button:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 14px 56px rgba(255,255,255,.55)}
button:focus-visible{outline:3px solid #fff;outline-offset:4px}
#note{min-height:1.2em;font-size:.88rem;color:#ff9bb0}
</style>
</head>
<body>
<main id="gate" hidden>
  <div class="face" aria-hidden="true">😠</div>
  <h1>ALLOW POPUPS NOW!</h1>
  <p>Astra needs pop-ups to launch. Allow them once and it will open by itself every time after this.</p>
  <ol>
    <li>Click the blocked pop-up icon in your address bar</li>
    <li>Choose <b>Always allow pop-ups</b> for this site</li>
    <li>That's it. It will open on its own</li>
  </ol>
  <button id="retry">I allowed them, open it</button>
</main>

<main id="done" hidden></main>

<div id="note" style="position:fixed;left:0;right:0;bottom:18px;text-align:center"></div>

<script>
var $=function(i){return document.getElementById(i)};
var KEY='astra_popups',gate=$('gate'),done=$('done'),note=$('note'),timer=null,isOpen=false;

/* fetch the session page up front so it can be written into a fresh about:blank */
var src=fetch('popup.html').then(function(r){
  if(!r.ok)throw new Error('popup.html not found ('+r.status+')');
  return r.text();
});
src.catch(function(e){note.textContent='Could not load popup.html: '+e.message});

function setView(open){
  isOpen=open;
  gate.hidden=open;done.hidden=!open;
  if(open){clearInterval(timer);timer=null}
  else if(!timer)timer=setInterval(function(){tryOpen()},1500);
}

function tryOpen(){
  if(isOpen)return false;
  var w=null;
  try{w=window.open('about:blank','_blank')}catch(e){}
  if(!w||w.closed){setView(false);return false}

  try{localStorage.setItem(KEY,'1')}catch(e){}
  setView(true);
  note.textContent='';

  src.then(function(html){
    w.document.open();w.document.write(html);w.document.close();
  }).catch(function(){try{w.close()}catch(e){}});

  /* some blockers hand back a window and close it right away */
  setTimeout(function(){
    if(w.closed){
      try{localStorage.removeItem(KEY)}catch(e){}
      setView(false);
    }
  },300);
  return true;
}

$('retry').onclick=function(){if(!tryOpen())note.textContent='Still blocked. Allow pop-ups for this site, then click again.'};

/* every visit: open straight away. If pop-ups were never allowed (or got revoked) this fails and the gate shows. */
tryOpen();
</script>
</body>
</html>
