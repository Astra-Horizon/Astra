<style>
:root{--head:'Unbounded','Manrope',system-ui,sans-serif;--body:'Manrope',system-ui,sans-serif;--a:#fff;--on:#000;--p:rgba(12,12,15,.94);--t:#fff;--d:#9b9ba5;--l:rgba(255,255,255,.16);--s:rgba(255,255,255,.07);--r:26px;--cr:999px;--bl:22px;--mw:420px;--eo:.16;--osz:44px;--ts:96px;--wp:#000;--wb:0px;--dim:0}
:root[data-s=light]{--t:#111;--d:#6b6b75;--l:rgba(0,0,0,.14);--s:rgba(0,0,0,.06)}
*{box-sizing:border-box}

h1{font:800 clamp(2.4rem,8vw,3.8rem)/1.05 var(--head);letter-spacing:-.04em;margin:0}
.btn{border:0;border-radius:999px;padding:.8rem 1.8rem;font-weight:800;color:var(--on);background:var(--a);transition:transform .2s,filter .2s,box-shadow .2s}

.center{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}

.edge[data-p=right],.edge[data-p=left]{top:0;bottom:0;width:14px}
.edge[data-p=right]{right:0}.edge[data-p=left]{left:0}
.edge[data-p=top],.edge[data-p=bottom]{left:0;right:0;height:14px}
.edge[data-p=top]{top:0}.edge[data-p=bottom]{bottom:0}
.edge[data-p=right]::after,.edge[data-p=left]::after{top:42%;bottom:42%;width:3px}
.edge[data-p=right]::after{right:1px}.edge[data-p=left]::after{left:1px}
.edge[data-p=top]::after,.edge[data-p=bottom]::after{left:42%;right:42%;height:3px}

#menu{position:fixed;z-index:70;color:var(--t);background:var(--p);backdrop-filter:blur(var(--bl));-webkit-backdrop-filter:blur(var(--bl));border:1px solid var(--l);box-shadow:0 20px 70px rgba(0,0,0,.55);overflow:auto;padding:22px;font-size:15px;visibility:hidden;opacity:0;border-radius:var(--r);transition:transform .24s cubic-bezier(.2,.9,.3,1),opacity .2s,visibility 0s .24s}

#menu[data-pos=bottom]{bottom:12px;left:0;right:0;margin:0 auto;width:min(720px,calc(100vw - 24px));max-height:80vh;transform:translateY(calc(100% + 24px))}
#menu[data-pos=center]{top:50%;left:50%;width:min(var(--mw),calc(100vw - 24px));max-height:88vh;transform:translate(-50%,-46%) scale(.96)}

.foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px;padding:2px}

.two{display:flex;gap:8px;margin-bottom:8px}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:6px 0 2px}

#coach{position:fixed;z-index:95;left:50%;bottom:18px;transform:translateX(-50%);width:min(440px,calc(100vw - 24px));padding:16px;border-radius:20px;box-shadow:0 14px 60px rgba(0,0,0,.7)}
#coach.top{bottom:auto;top:18px}

#coach .btn{padding:.6rem 1.3rem}
.mock{position:relative;height:104px;border:1px solid var(--l);border-radius:12px;background:#000;margin-bottom:4px;overflow:hidden}
.mk{position:absolute;background:rgba(255,255,255,.14);border-radius:3px;transition:background .2s}

.mk.right{top:30%;bottom:30%;right:0;width:5px}.mk.left{top:30%;bottom:30%;left:0;width:5px}
.mk.top{left:30%;right:30%;top:0;height:5px}.mk.bottom{left:30%;right:30%;bottom:0;height:5px}

.mk.key.on{color:var(--on);border-color:var(--a)}
#toast{position:fixed;left:50%;bottom:22px;z-index:100;transform:translate(-50%,12px);max-width:90vw;padding:10px 16px;border-radius:14px;background:#1a1a1f;border:1px solid rgba(255,255,255,.2);color:#fff;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}

#home{display:block;padding:0;overflow:hidden}

.t-solid .tile{background:rgba(255,255,255,.2)}

</head>
<body>
<section id="launch" class="center">
  <h1>Astra</h1>
  <button class="btn big" id="launchBtn">Open Astra</button>
  <p id="note" role="status" style="min-height:1.5em;font-size:.88rem"></p>
  <button class="btn ghost" id="hereBtn" hidden>Open here instead</button>
</section>
<div id="app" hidden>
  <div id="stage"><div id="home">
    <canvas id="bg" hidden></canvas><div class="wps stars" id="wps" hidden></div>
    <div id="hd"><div id="clock"></div><div id="greet"></div></div>
    <div id="hsw"><input id="hs" type="text" placeholder="Search or paste a game link" spellcheck="false" autocomplete="off" aria-label="Search or paste a link"></div>
    <div id="tiles"></div><div id="free"></div><div id="xw"></div><div id="hhint"></div>
  </div></div>
  <i class="edge" data-p="right"></i><i class="edge" data-p="left"></i><i class="edge" data-p="top"></i><i class="edge" data-p="bottom"></i><i class="edge" data-p="corner"></i>
  <button id="orb" aria-label="Open menu"><i></i></button>
  <div id="scrim"></div>
  <div id="edbar" hidden><span>Drag things to move them</span><input type="range" id="edsz" hidden aria-label="Size of the selected item"><button class="chip" id="edReset">Reset</button><button class="chip on" id="edDone">Done</button></div>
  <nav id="menu" data-pos="right" aria-label="Astra menu" aria-hidden="true">
    <div class="mh"><b>Astra</b><button class="ic" id="bSet" aria-label="Settings" title="Settings">&#9881;</button><button class="ic" id="bX" aria-label="Close menu" title="Close">&times;</button></div>
    <div id="mMain">
      <form id="go"><input class="inp" id="omni" placeholder="Paste a game link or search" spellcheck="false" autocomplete="off" aria-label="Link or search"></form>
      <div class="lbl">Quick links</div><div class="chips" id="grid"></div>
      <div id="tlw"><div class="lbl">Open tabs</div><div id="tl"></div></div>
      <div class="foot"><button class="chip" id="bHome">Home</button><button class="chip" id="bMark">Bookmark</button><button class="chip" id="fs">Fullscreen</button><button class="chip" id="rl">Reload</button></div>
    </div>
    <div id="mSet" hidden></div>
  </nav>
</div>
<div id="wiz" class="center" hidden></div>
<div id="coach" hidden role="status"><div class="bar"><i id="cbar"></i></div><b id="ct"></b><p id="cs"></p><div class="nav"><button class="btn ghost" id="cx">Exit tour</button><button class="btn" id="cn">Next</button></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function(){

    c.append(bar(),el('h2','',s.t),el('p','sub',tx(s.s)),b);if(s.body)s.body(b);
    var prev=T.i>0&&T.steps[T.i-1].card,l=el('button','btn ghost',prev?'Back':'Skip tour');
    l.onclick=function(){prev?go(T.i-1):endTour()};nav.appendChild(l);
    if(s.alt){var a=el('button','btn ghost',s.alt[0]);a.onclick=s.alt[1];nav.appendChild(a)}
    var n=el('button','btn',s.next||'Next');n.onclick=function(){go(T.i+1)};nav.appendChild(n);
    c.appendChild(nav);w.appendChild(c);
  }
  function coach(s){
    $('wiz').hidden=true;var c=$('coach');c.hidden=false;
    if(s.pre)s.pre();
    c.classList.toggle('top',isOpen()&&menu.dataset.pos==='bottom');
    $('ct').textContent=s.t;$('cs').textContent=tx(s.s);
    $('cbar').style.width=Math.round(T.i/(T.steps.length-1)*100)+'%';
    T.wait=s.wait||null;$('cn').textContent=T.wait?'Skip':(s.next||'Next');
    glow(s.glow);
  }
  $('cn').onclick=function(){go(T.i+1)};$('cx').onclick=endTour;
  function ensure(){if(!isOpen())openMenu(posFor());else if(setView){setView=false;renderMenu()}}
  function openSet(tab){openMenu(posFor());S=tab;setView=true;renderMenu()}

  function tutSteps(){return[
    {card:1,t:'Welcome to Astra',s:'A tiny menu for your games that stays out of the way. Make it yours with animated scenes, widgets, images and GIFs. This tour takes about two minutes, and you\u2019ll try everything for real.'},
    {card:1,t:'Pick your look',s:'Choose a theme and accent color. It changes live. Fonts and more are in settings.',body:themePicker},
    {card:1,t:'Choose a scene and speed',s:'Black hole, water, sunset, forest, jungle and galaxy are all animated. Pick a performance mode to match your device: Saver and Static use far less battery.',body:sceneBody},
    {card:1,t:'How will you open the menu?',s:'Pick any mix. The preview shows where each one lives on your screen.',body:function(c){var m=mock(),h=el('div');c.append(m,h);modePicker(h,function(){mockSync(m)});mockSync(m)}},
    {t:'Try it: open the menu',s:function(){return hint()},wait:'open',pre:function(){closeMenu(true)}},
    {t:'Search or paste a link',s:'Type a game link or a search here and press Enter. Every page opens in its own tab.',glow:'#omni',pre:ensure},
    {t:'Quick links',s:'One tap to launch. Add your own in settings, or bookmark any page you\u2019re on.',glow:'#grid'},
    {t:'Your open tabs',s:'Tap a tab to jump to it, or \u00d7 to close it. Tabs keep running in the background.',glow:'#tl',skipIf:function(){return !tabs.length}},
    {t:'Handy buttons',s:'Home shows the clock page. Bookmark saves the current page as a quick link. Then Fullscreen and Reload.',glow:'.foot',pre:ensure},
    {t:'Settings',s:'Themes, scenes, widgets, fonts, the clock, open modes, links and the CloudMoon fix live behind the gear.',glow:'#bSet',pre:ensure},
    {t:'Try it: add a widget',s:'Add a clock, note, countdown, image or GIF. Tap one of the buttons. Tap a widget in your list to change its font, color and size.',glow:'#wAdd',wait:'wadd',pre:function(){openSet('widgets')}},
    {t:'Move and resize',s:'Drag any widget, bookmark, the title or the search bar. Tap one, then use the Size slider at the top. Press Done when you\u2019re happy.',wait:'mv',ed:1,pre:function(){setView=false;edit(true)}},
    {t:'Everything is saved',s:'Scenes, widgets, positions and uploaded images are stored on this device. Use Settings, then Data, to back them up.',glow:'#bSet',pre:function(){ensure()}},
    {t:'Move the button',s:'Drag the floating button wherever suits you. It remembers the spot.',wait:'drag',skipIf:function(){return !has('orb')},pre:function(){closeMenu(true)}},
    {card:1,t:'You\u2019re all set',s:'One more thing: CloudMoon needs a small fix to work in a window like this. Want a guided setup?',next:'Finish',alt:['Set up CloudMoon',function(){P.done=1;save();run(cloudSteps())}],body:function(c){c.appendChild(el('p','sub',hint()))}}
  ]}
  function cloudSteps(){return[
    {t:'Log in to CloudMoon',s:'We opened CloudMoon for you. Log in to your account first, then press Next.',pre:function(){
      closeMenu(true);setView=false;
      var k=-1;tabs.forEach(function(t,i){if(host(t.url).indexOf('cloudmoon')>-1)k=i});
      if(k>-1)select(k);else openUrl(CLOUD);
    }},
    {t:'Turn on CloudMoon fix',s:'Switch on \u201cCloudMoon fix\u201d in the settings that just opened.',glow:'#fixRow',wait:'fix',skipIf:function(){return !!P.fix},pre:function(){openMenu(posFor());setView=true;renderMenu()}},
    {t:'Open a game',s:'Pick any game in CloudMoon. The fix now applies to every tab. Press Next when you\u2019re playing.',pre:function(){setView=false;closeMenu(true)}},
    {t:'If you ever get logged out',s:'The fix has to be off to log in. Turn it off, log in to CloudMoon, then turn it back on.',next:'Got it',glow:'#fixRow',pre:function(){openMenu(posFor());setView=true;renderMenu()}}
  ]}

  applyModes();renderHome();renderW();lay();renderMenu();select(-1);tick();kick();
  if(!P.done)run(tutSteps());else{document.body.classList.add('peek');setTimeout(function(){document.body.classList.remove('peek')},5000)}
}
